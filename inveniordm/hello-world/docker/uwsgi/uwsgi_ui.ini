[uwsgi]
http-socket = 0.0.0.0:5000
stats = 0.0.0.0:9000
module = invenio_app.wsgi_ui:application
mount = /invenio=invenio_app.wsgi_ui:application
manage-script-name = true
static-map = /invenio/static=/opt/invenio/var/instance/static
master = true
die-on-term = true
processes = 2
threads = 2
single-interpreter = true
buffer-size = 8192
wsgi-disable-file-wrapper = true

[uwsgi]
http-socket = 0.0.0.0:5000
stats = 0.0.0.0:9001
module = invenio_app.wsgi_rest:application
mount = /invenio/api=invenio_app.wsgi_rest:application
manage-script-name = true
static-map = /invenio/static=/opt/invenio/var/instance/static
master = true
die-on-term = true
processes = 2
threads = 2
wsgi-disable-file-wrapper = true
single-interpreter = true
buffer-size = 8192

# Nginx recibe tráfico de Apache (host) que termina SSL.
# Apache proxy reverse a nginx:80/invenio/...
# Nginx quita el prefijo /invenio, pasa SCRIPT_NAME a uwsgi.
# No hay SSL aquí, ni redirect.

upstream ui_server {
  server web-ui:5000 fail_timeout=0;
}
upstream api_server {
  server web-api:5000 fail_timeout=0;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  charset utf-8;
  keepalive_timeout 5;

  proxy_request_buffering off;
  proxy_http_version 1.1;

  # --- UI ---
  location /invenio {
    rewrite ^/invenio(/.*)$ $1 break;
    uwsgi_pass ui_server;
    include uwsgi_params;
    uwsgi_buffering off;
    uwsgi_request_buffering off;
    chunked_transfer_encoding off;
    uwsgi_param Host $host;
    uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
    uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
    uwsgi_param X-Request-ID $request_id;
    uwsgi_param SCRIPT_NAME /invenio;
    uwsgi_hide_header X-Session-ID;
    uwsgi_hide_header X-User-ID;
    client_max_body_size 100m;
  }

  # --- API ---
  location /invenio/api {
    rewrite ^/invenio(/.*)$ $1 break;
    uwsgi_pass api_server;
    include uwsgi_params;
    uwsgi_buffering off;
    uwsgi_request_buffering off;
    chunked_transfer_encoding off;
    uwsgi_param Host $host;
    uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
    uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
    uwsgi_param X-Request-ID $request_id;
    uwsgi_param SCRIPT_NAME /invenio;
    uwsgi_hide_header X-Session-ID;
    uwsgi_hide_header X-User-ID;
    client_max_body_size 100m;
  }

  # --- API file uploads ---
  location ~ /invenio/api/records/.+/draft/files/.+/content(/[0-9]+)?/?$ {
    rewrite ^/invenio(/.*)$ $1 break;
    gzip off;
    uwsgi_pass api_server;
    include uwsgi_params;
    uwsgi_buffering off;
    uwsgi_request_buffering off;
    chunked_transfer_encoding off;
    uwsgi_param Host $host;
    uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
    uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
    uwsgi_param X-Request-ID $request_id;
    uwsgi_param SCRIPT_NAME /invenio;
    uwsgi_hide_header X-Session-ID;
    uwsgi_hide_header X-User-ID;
    client_max_body_size 50G;
  }

  # --- Static files ---
  location /invenio/static {
    alias /opt/invenio/var/instance/static;
    autoindex off;
  }
}

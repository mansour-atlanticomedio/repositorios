services:
  app:
    build:
      context: ./hello-world
      dockerfile: ../Dockerfile.dev
    image: inveniordm-dev:latest
    container_name: invenio_app_dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      INVENIO_SECRET_KEY: ${INVENIO_SECRET_KEY:-CHANGE_ME}
      INVENIO_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-hello-world}:${POSTGRES_PASSWORD:-hello-world}@db:5432/${POSTGRES_DB:-hello-world}
      INVENIO_CACHE_TYPE: redis
      INVENIO_CACHE_REDIS_URL: redis://cache:6379/0
      INVENIO_ACCOUNTS_SESSION_REDIS_URL: redis://cache:6379/1
      INVENIO_CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@mq:5672/
      INVENIO_CELERY_RESULT_BACKEND: redis://cache:6379/2
      INVENIO_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@mq:5672/
      INVENIO_RATELIMIT_STORAGE_URL: redis://cache:6379/3
      INVENIO_COMMUNITIES_IDENTITIES_CACHE_REDIS_URL: redis://cache:6379/4
      INVENIO_SEARCH_HOSTS: '["http://search:9200"]'
      INVENIO_WSGI_PROXIES: "2"
      INVENIO_FORCE_HTTPS: "false"
      INVENIO_SESSION_COOKIE_SECURE: "false"
      FLASK_DEBUG: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      mq:
        condition: service_started
      search:
        condition: service_healthy
    volumes:
      - ./hello-world/invenio.dev.cfg:/opt/invenio/var/instance/invenio.cfg
      - invenio_data:/opt/invenio/var/instance/data

  db:
    image: postgres:14.13
    container_name: invenio_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hello-world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hello-world}
      POSTGRES_DB: ${POSTGRES_DB:-hello-world}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hello-world} -d ${POSTGRES_DB:-hello-world}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7
    container_name: invenio_cache_dev
    restart: unless-stopped
    volumes:
      - cache_data:/data

  mq:
    image: rabbitmq:3-management
    container_name: invenio_mq_dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - mq_data:/var/lib/rabbitmq

  search:
    image: opensearchproject/opensearch:2.17.1
    container_name: invenio_search_dev
    restart: unless-stopped
    environment:
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "discovery.type=single-node"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    volumes:
      - search_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  db_data:
  cache_data:
  mq_data:
  search_data:
  invenio_data:


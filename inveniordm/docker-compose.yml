services:
  web-ui:
    build:
      context: ./hello-world
      dockerfile: ../Dockerfile
    image: inveniordm-prod:latest
    container_name: invenio_web_ui
    restart: always
    ports:
      - "5000:5000"
    environment:
      INVENIO_SECRET_KEY: ${INVENIO_SECRET_KEY}
      INVENIO_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INVENIO_CACHE_TYPE: redis
      INVENIO_CACHE_REDIS_URL: redis://cache:6379/0
      INVENIO_ACCOUNTS_SESSION_REDIS_URL: redis://cache:6379/1
      INVENIO_CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672/
      INVENIO_CELERY_RESULT_BACKEND: redis://cache:6379/2
      INVENIO_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672/
      INVENIO_RATELIMIT_STORAGE_URL: redis://cache:6379/3
      INVENIO_COMMUNITIES_IDENTITIES_CACHE_REDIS_URL: redis://cache:6379/4
      INVENIO_SITE_UI_URL: https://localhost/invenio
      INVENIO_SITE_API_URL: https://localhost/invenio/api
      INVENIO_SEARCH_HOSTS: '["http://search:9200"]'
      INVENIO_WSGI_PROXIES: "1"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      mq:
        condition: service_started
      search:
        condition: service_healthy
    volumes:
      - uploaded_data:/opt/invenio/var/instance/data
      - archived_data:/opt/invenio/var/instance/archive

  web-api:
    build:
      context: ./hello-world
      dockerfile: ../Dockerfile
    image: inveniordm-prod:latest
    container_name: invenio_web_api
    restart: always
    entrypoint: uwsgi /opt/invenio/var/instance/uwsgi_rest.ini
    ports:
      - "5001:5000"
    environment:
      INVENIO_SECRET_KEY: ${INVENIO_SECRET_KEY}
      INVENIO_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INVENIO_CACHE_TYPE: redis
      INVENIO_CACHE_REDIS_URL: redis://cache:6379/0
      INVENIO_ACCOUNTS_SESSION_REDIS_URL: redis://cache:6379/1
      INVENIO_CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672/
      INVENIO_CELERY_RESULT_BACKEND: redis://cache:6379/2
      INVENIO_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672/
      INVENIO_RATELIMIT_STORAGE_URL: redis://cache:6379/3
      INVENIO_COMMUNITIES_IDENTITIES_CACHE_REDIS_URL: redis://cache:6379/4
      INVENIO_SITE_UI_URL: https://localhost/invenio
      INVENIO_SITE_API_URL: https://localhost/invenio/api
      INVENIO_SEARCH_HOSTS: '["http://search:9200"]'
      INVENIO_WSGI_PROXIES: "1"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      mq:
        condition: service_started
      search:
        condition: service_healthy
    volumes:
      - uploaded_data:/opt/invenio/var/instance/data
      - archived_data:/opt/invenio/var/instance/archive

  worker:
    build:
      context: ./hello-world
      dockerfile: ../Dockerfile
    image: inveniordm-prod:latest
    container_name: invenio_worker
    restart: always
    entrypoint: celery -A invenio_app.celery worker --loglevel=INFO
    environment:
      INVENIO_SECRET_KEY: ${INVENIO_SECRET_KEY}
      INVENIO_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INVENIO_CACHE_TYPE: redis
      INVENIO_CACHE_REDIS_URL: redis://cache:6379/0
      INVENIO_ACCOUNTS_SESSION_REDIS_URL: redis://cache:6379/1
      INVENIO_CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672/
      INVENIO_CELERY_RESULT_BACKEND: redis://cache:6379/2
      INVENIO_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672/
      INVENIO_RATELIMIT_STORAGE_URL: redis://cache:6379/3
      INVENIO_COMMUNITIES_IDENTITIES_CACHE_REDIS_URL: redis://cache:6379/4
      INVENIO_SEARCH_HOSTS: '["http://search:9200"]'
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      mq:
        condition: service_started
      search:
        condition: service_healthy
    volumes:
      - uploaded_data:/opt/invenio/var/instance/data

  scheduler:
    build:
      context: ./hello-world
      dockerfile: ../Dockerfile
    image: inveniordm-prod:latest
    container_name: invenio_scheduler
    restart: always
    entrypoint: celery -A invenio_app.celery beat --scheduler invenio_jobs.services.scheduler:RunScheduler --loglevel=INFO
    environment:
      INVENIO_SECRET_KEY: ${INVENIO_SECRET_KEY}
      INVENIO_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INVENIO_CACHE_TYPE: redis
      INVENIO_CACHE_REDIS_URL: redis://cache:6379/0
      INVENIO_CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672/
      INVENIO_CELERY_RESULT_BACKEND: redis://cache:6379/2
      INVENIO_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672/
      INVENIO_SEARCH_HOSTS: '["http://search:9200"]'
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_started

  db:
    image: postgres:14.13
    container_name: invenio_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 20

  cache:
    image: redis:7
    container_name: invenio_cache
    restart: always
    volumes:
      - cache_data:/data

  mq:
    image: rabbitmq:3-management
    container_name: invenio_mq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - mq_data:/var/lib/rabbitmq

  search:
    image: opensearchproject/opensearch:2.17.1
    container_name: invenio_search
    restart: always
    environment:
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "discovery.type=single-node"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-2g}
    volumes:
      - search_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20

volumes:
  db_data:
  cache_data:
  mq_data:
  search_data:
  uploaded_data:
  archived_data:
